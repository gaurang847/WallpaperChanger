name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Generate Changelog from Commits
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "Generating changelog since $PREV_TAG"
            LOG=$(git log "$PREV_TAG..HEAD" --no-merges --pretty=format:"- %s (%h)")
            COMPARE="**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG...${{ github.ref_name }}"
          else
            echo "No previous tag found, generating changelog from beginning"
            LOG=$(git log --no-merges --pretty=format:"- %s (%h)")
            COMPARE=""
          fi

          {
            echo "commits<<EOF"
            echo "$LOG"
            if [ -n "$COMPARE" ]; then
              echo ""
              echo "$COMPARE"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare Windows Distribution Bundle
        run: |
          mkdir -p dist/WallpaperChanger
          cp target/WallpaperChanger-*.jar dist/WallpaperChanger/WallpaperChanger.jar
          JAR_NAME=$(basename target/WallpaperChanger-*.jar)
          cp target/WallpaperChanger-*.jar "dist/WallpaperChanger/$JAR_NAME"
          cp install.bat dist/WallpaperChanger/
          cp run.bat dist/WallpaperChanger/
          cp uninstall.bat dist/WallpaperChanger/
          cp run-background.vbs dist/WallpaperChanger/
          
          cat << 'EOF' > dist/WallpaperChanger/QUICKSTART.txt
          =====================================================
            Wallpaper Changer for Windows
          =====================================================

          REQUIREMENTS:
          - Windows 10 or 11
          - Java Runtime (JRE / JDK) 21 or higher installed:
            https://adoptium.net/temurin/releases/?version=21

          HOW TO RUN:
          1. Permanent Installation (Start Menu + Auto-Startup):
             Double-click 'install.bat'

          2. Run Portable (Without installing):
             Double-click 'run.bat'

          3. Uninstall:
             Double-click 'uninstall.bat'

          GOOGLE DRIVE SETUP:
          Follow the setup guide in the online documentation:
          https://github.com/${{ github.repository }}#google-drive-setup-guide
          =====================================================
          EOF
          
          cd dist
          zip -r WallpaperChanger-windows.zip WallpaperChanger

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Wallpaper Changer ${{ github.ref_name }}"
          body: |
            ### Wallpaper Changer ${{ github.ref_name }}

            ---

            ### 📦 Download Assets
            - **`WallpaperChanger-windows.zip`** (Recommended): Complete Windows package with one-click installer (`install.bat`), portable launcher (`run.bat`), and background scripts.
            - **`WallpaperChanger-1.0.0.jar`**: Standalone executable fat JAR (requires Java 21+).

            ---

            ### 📝 What's Changed
            ${{ steps.changelog.outputs.commits }}

            ---

            ### 🚀 Quick Start
            1. Ensure **[Java Runtime (JRE / JDK) 21 or higher](https://adoptium.net/temurin/releases/?version=21)** is installed on Windows.
            2. Download and extract **`WallpaperChanger-windows.zip`**.
            3. Run `install.bat` (installer) or `run.bat` (portable).

            ---

            📖 **Full Documentation & Google Drive Setup Guide**: [README](https://github.com/${{ github.repository }}#readme)
          files: |
            dist/WallpaperChanger-windows.zip
            target/WallpaperChanger-*.jar
          generate_release_notes: false
          draft: false
          prerelease: false
