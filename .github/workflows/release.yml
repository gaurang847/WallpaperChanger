name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package

      - name: Prepare Windows Distribution Bundle
        run: |
          mkdir -p dist/WallpaperChanger
          cp target/WallpaperChanger-*.jar dist/WallpaperChanger/WallpaperChanger.jar
          JAR_NAME=$(basename target/WallpaperChanger-*.jar)
          cp target/WallpaperChanger-*.jar "dist/WallpaperChanger/$JAR_NAME"
          cp install.bat dist/WallpaperChanger/
          cp run.bat dist/WallpaperChanger/
          cp uninstall.bat dist/WallpaperChanger/
          cp run-background.vbs dist/WallpaperChanger/
          
          cat << 'EOF' > dist/WallpaperChanger/QUICKSTART.txt
          =====================================================
            Wallpaper Changer for Windows
          =====================================================

          REQUIREMENTS:
          - Windows 10 or 11
          - Java Runtime (JRE / JDK) 21 or higher installed:
            https://adoptium.net/temurin/releases/?version=21

          HOW TO RUN:
          1. Permanent Installation (Start Menu + Auto-Startup):
             Double-click 'install.bat'

          2. Run Portable (Without installing):
             Double-click 'run.bat'

          3. Uninstall:
             Double-click 'uninstall.bat'

          GOOGLE DRIVE SETUP:
          Follow the setup guide in the online documentation:
          https://github.com/${{ github.repository }}#google-drive-setup-guide
          =====================================================
          EOF
          
          cd dist
          zip -r WallpaperChanger-windows.zip WallpaperChanger

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Wallpaper Changer ${{ github.ref_name }}"
          body: |
            ### Wallpaper Changer ${{ github.ref_name }}
            
            A lightweight, modern Windows desktop background application that keeps your wallpaper synchronized with a centralized Google Drive folder.
            
            ---
            
            ### 📦 Download Assets
            - **`WallpaperChanger-windows.zip`** (Recommended): Complete Windows package with one-click installer (`install.bat`), portable launcher (`run.bat`), and background scripts.
            - **`WallpaperChanger-1.0.0.jar`**: Standalone executable fat JAR (requires Java 21+).
            
            ---
            
            ### 🚀 Quick Start
            1. **Prerequisite**: Ensure **[Java Runtime (JRE / JDK) 21 or higher](https://adoptium.net/temurin/releases/?version=21)** is installed on Windows.
            2. Download and extract **`WallpaperChanger-windows.zip`**.
            3. Run your preferred launch method:
               - **Install permanently**: Double-click `install.bat` (installs to `%LOCALAPPDATA%`, creates Start Menu shortcut, and registers background auto-startup).
               - **Run portable**: Double-click `run.bat` (runs in-place without modifying system settings).
               - **Silent background**: Double-click `run-background.vbs` (launches straight to the Windows System Tray).
            4. In the Settings window, link your Google account or Service Account key, paste your Google Drive folder link or ID, and click **Save Settings**!
            
            ---
            
            ### ✨ Key Features
            - **Centralized Google Drive Sync**: Sync wallpapers from a single Google Drive folder across all your Windows PCs.
            - **Recursive Subfolder Search**: Traverse nested subfolders with selectable search depth (from 1 level up to 10 levels).
            - **Zero Local Clutter**: Automatically removes previously unset wallpapers so only the currently active wallpaper remains on disk.
            - **Safe Empty-Folder Handling**: Preserves your existing desktop wallpaper and local files if the Drive folder contains 0 images.
            - **Dual Authentication Support**:
              - **Service Account (Recommended)**: Set up once for permanent background rotation with no 7-day token expirations or browser login popups.
              - **OAuth 2.0**: Quick sign-in via browser with personal Google account.
            - **Silent System Tray Integration**: Background rotation with right-click tray menu (*Change Wallpaper Now*, *Pause/Resume*, *Open Wallpaper Folder*, *Settings*, *Exit*).
            - **Customizable Intervals & Styling**: Rotation from 5 minutes to 24 hours (or custom minutes) with Fill, Fit, Center, Tile, or Span styling.
            - **Single-Instance Enforcement**: Only one background instance runs at a time; launching again automatically brings the Settings window to focus.
            
            ---
            
            📖 **Setup Guide & Documentation**: [GitHub Repository README](https://github.com/${{ github.repository }}#readme)
          files: |
            dist/WallpaperChanger-windows.zip
            target/WallpaperChanger-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
